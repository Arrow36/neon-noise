<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="google-site-verification" content="N-9adN0Gre4BCt7JiVq_DB5FDHQRKawy7B7-J0qnz9o" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09031c">
  <title>NEON//NOISE 噪音频谱分析仪</title>
  <style>
    :root {
      color-scheme: dark;
      --night: #060111;
      --panel: rgba(12, 5, 35, .82);
      --panel-strong: rgba(8, 3, 25, .94);
      --line: rgba(90, 224, 255, .18);
      --cyan: #4df6ff;
      --pink: #ff3cac;
      --violet: #9d54ff;
      --sun: #ffb64d;
      --text: #f7efff;
      --muted: #a89dbc;
    }

    * { box-sizing: border-box; }

    html { background: var(--night); }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--text);
      background:
        radial-gradient(circle at 16% 0%, rgba(102, 38, 190, .34), transparent 34%),
        radial-gradient(circle at 88% 11%, rgba(255, 45, 157, .18), transparent 30%),
        linear-gradient(180deg, #080218 0%, #09031c 56%, #030109 100%);
      font: 15px/1.5 Inter, "Microsoft YaHei", system-ui, sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      z-index: -2;
      top: 70px;
      right: 8vw;
      width: clamp(180px, 24vw, 340px);
      aspect-ratio: 1;
      border-radius: 50%;
      opacity: .7;
      background:
        repeating-linear-gradient(180deg, transparent 0 13px, rgba(6, 1, 17, .68) 14px 19px),
        linear-gradient(180deg, #ffe16b 0%, #ff7b55 44%, #ff2caf 100%);
      box-shadow: 0 0 80px rgba(255, 53, 172, .35);
      filter: saturate(1.15);
    }

    body::after {
      content: "";
      position: fixed;
      z-index: -1;
      left: -20%;
      right: -20%;
      bottom: -19vh;
      height: 58vh;
      opacity: .32;
      background-image:
        linear-gradient(rgba(77, 246, 255, .42) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 60, 172, .45) 1px, transparent 1px);
      background-size: 54px 40px;
      transform: perspective(420px) rotateX(61deg);
      transform-origin: 50% 100%;
      mask-image: linear-gradient(to bottom, transparent, #000 32%, #000);
    }

    .shell {
      position: relative;
      width: min(1220px, calc(100% - 32px));
      margin: 0 auto;
      padding: 30px 0 64px;
    }

    header {
      position: relative;
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 24px;
    }

    .eyebrow {
      margin-bottom: 5px;
      color: var(--cyan);
      font: 700 11px/1.2 Consolas, monospace;
      letter-spacing: .28em;
      text-transform: uppercase;
      text-shadow: 0 0 12px rgba(77, 246, 255, .75);
    }

    h1 {
      display: inline-block;
      width: fit-content;
      margin: 0;
      padding-right: .28em;
      max-width: 820px;
      overflow: visible;
      font: 900 clamp(29px, 5.5vw, 66px)/.98 "Arial Black", Impact, sans-serif;
      font-style: italic;
      letter-spacing: -.055em;
      text-transform: uppercase;
      background: linear-gradient(90deg, #ffffff 0%, var(--cyan) 35%, #bd77ff 68%, var(--pink) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 14px rgba(77, 246, 255, .24));
    }

    h1::after {
      content: "";
      display: inline-block;
      width: .22em;
    }

    .subtitle { margin: 9px 0 0; color: var(--muted); }

    .live-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      flex: 0 0 auto;
      min-height: 0;
      padding: 8px 12px;
      border: 1px solid rgba(255, 60, 172, .34);
      border-radius: 999px;
      color: #d8cfe5;
      background: rgba(16, 5, 38, .74);
      font: 700 11px/1 Consolas, monospace;
      letter-spacing: .13em;
      white-space: nowrap;
      cursor: pointer;
    }

    .status-row {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      max-width: 360px;
      min-width: 0;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #746b82;
      box-shadow: none;
    }

    .is-live .live-dot {
      background: var(--pink);
      box-shadow: 0 0 13px var(--pink);
      animation: pulse 1.2s ease-in-out infinite;
    }

    @keyframes pulse { 50% { opacity: .35; transform: scale(.72); } }

    .control-deck,
    .panel,
    .metric {
      border: 1px solid rgba(94, 222, 255, .17);
      background: linear-gradient(145deg, rgba(20, 7, 54, .91), rgba(7, 3, 23, .91));
      box-shadow: 0 18px 55px rgba(0, 0, 0, .32), inset 0 1px rgba(255, 255, 255, .035);
      backdrop-filter: blur(13px);
    }

    .control-deck {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px;
      border-radius: 15px;
    }

    .controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

    .gain-control {
      display: grid;
      grid-template-columns: auto minmax(110px, 190px) 54px;
      align-items: center;
      gap: 10px;
      min-height: 42px;
      padding: 0 12px;
      border: 1px solid rgba(157, 84, 255, .28);
      border-radius: 9px;
      color: #bfb1ce;
      background: rgba(157, 84, 255, .07);
      font: 700 10px/1 Consolas, monospace;
      letter-spacing: .08em;
    }

    .gain-control output { color: var(--cyan); text-align: right; }

    input[type="range"] {
      width: 100%;
      min-height: 26px;
      accent-color: var(--pink);
      cursor: pointer;
      touch-action: pan-x;
    }
    input[type="range"]:disabled { cursor: not-allowed; opacity: .45; }

    input[type="range"]::-webkit-slider-thumb { width: 24px; height: 24px; }

    button {
      min-height: 42px;
      padding: 0 17px;
      border: 1px solid transparent;
      border-radius: 9px;
      cursor: pointer;
      font: 800 12px/1 Consolas, monospace;
      letter-spacing: .08em;
      transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
    }

    button:hover:not(:disabled) { transform: translateY(-1px); }
    button:active:not(:disabled) { transform: translateY(1px); }
    button:disabled { cursor: default; opacity: .5; }

    .primary {
      color: #070316;
      background: linear-gradient(100deg, var(--cyan), #81ffcf);
      box-shadow: 0 0 24px rgba(77, 246, 255, .24);
    }

    .primary:hover:not(:disabled) { box-shadow: 0 0 34px rgba(77, 246, 255, .42); }

    .ghost {
      color: #e9ddf5;
      border-color: rgba(255, 60, 172, .3);
      background: rgba(255, 60, 172, .07);
    }

    .analysis-button {
      color: #160519;
      background: linear-gradient(100deg, #ffd06e, #ff65bd);
      box-shadow: 0 0 22px rgba(255, 60, 172, .18);
    }

    .analysis-mode-control {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 42px;
      padding: 0 10px;
      border: 1px solid rgba(255, 208, 110, .28);
      border-radius: 9px;
      color: #c8b9d4;
      background: rgba(255, 182, 77, .06);
      font: 700 10px/1 Consolas, monospace;
      letter-spacing: .06em;
    }

    .analysis-mode-control select {
      min-width: 190px;
      max-width: 265px;
      align-self: stretch;
      height: auto;
      min-height: 38px;
      border: 0;
      outline: 0;
      color: #fff1ca;
      background: transparent;
      font: 700 11px/1 "Microsoft YaHei", system-ui, sans-serif;
      text-align: center;
      text-align-last: center;
      cursor: pointer;
    }

    .analysis-mode-control select option {
      color: #1b1029;
      background: #fff;
    }

    .resolution {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 2px 8px;
      color: #9087a2;
      font: 11px/1.45 Consolas, monospace;
      text-align: right;
    }

    .resolution span { white-space: nowrap; }

    .metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 14px 0;
    }

    .metric {
      position: relative;
      overflow: hidden;
      min-height: 112px;
      padding: 16px 18px;
      border-radius: 14px;
    }

    .metric::after {
      content: "";
      position: absolute;
      right: -24px;
      bottom: -42px;
      width: 120px;
      height: 90px;
      border-radius: 50%;
      background: var(--glow, var(--cyan));
      opacity: .13;
      filter: blur(25px);
    }

    .metric:nth-child(2) { --glow: var(--pink); }
    .metric-label {
      display: grid;
      gap: 4px;
      color: #9288a5;
      font: 700 10px/1.1 Consolas, monospace;
      letter-spacing: .1em;
    }
    .metric-label-en { white-space: nowrap; }
    .metric-label-zh { font-size: 11px; letter-spacing: .12em; }

    .metric-value {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: baseline;
      gap: .3em;
      white-space: nowrap;
      margin-top: 10px;
      color: var(--cyan);
      font: 800 clamp(24px, 4.2vw, 40px)/1 Consolas, monospace;
      text-shadow: 0 0 18px rgba(77, 246, 255, .32);
    }
    .metric-unit { font-size: .65em; }

    .metric:nth-child(2) .metric-value { color: #ff76c8; text-shadow: 0 0 18px rgba(255, 60, 172, .3); }

    .panel {
      position: relative;
      overflow: hidden;
      margin-top: 14px;
      border-radius: 16px;
    }

    .panel::before {
      content: "";
      position: absolute;
      z-index: 2;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--cyan), var(--pink), transparent);
      opacity: .72;
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 52px;
      padding: 12px 16px;
      border-bottom: 1px solid rgba(94, 222, 255, .12);
    }

    .panel-title { font: 800 12px/1 Consolas, monospace; letter-spacing: .13em; }
    .panel-note { color: #837992; font: 11px/1.2 Consolas, monospace; }
    .chart-wrap { position: relative; background: rgba(2, 1, 11, .84); }
    .spectrum-stack .subhead { border-top: 1px solid rgba(94, 222, 255, .14); }
    .shared-axis-wrap {
      position: relative;
      border-top: 1px solid rgba(94, 222, 255, .13);
      border-bottom: 1px solid rgba(94, 222, 255, .13);
      background: linear-gradient(180deg, rgba(11, 3, 31, .98), rgba(4, 1, 14, .98));
    }
    canvas { display: block; width: 100%; touch-action: pan-y; }
    #spectrum { height: 420px; cursor: crosshair; }
    #waterfall { height: 364px; cursor: crosshair; }
    #sharedAxis { display: block; width: 100%; height: 58px; }

    .chart-overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: block;
      width: 100%;
      height: 100%;
      overflow: hidden;
      pointer-events: none;
      user-select: none;
    }

    .chart-overlay text,
    #sharedAxis text {
      font-family: Consolas, "Microsoft YaHei", monospace;
      text-rendering: geometricPrecision;
    }

    .overlay-axis-label {
      fill: rgba(222, 214, 234, .9);
      font-size: 12px;
      font-weight: 600;
    }

    .overlay-time-label {
      fill: rgba(255, 255, 255, .88);
      font-size: 12px;
      font-weight: 700;
    }

    .overlay-line {
      fill: none;
      vector-effect: non-scaling-stroke;
    }

    .peak-frequency,
    .measurement-frequency {
      font-size: 19px;
      font-weight: 900;
      paint-order: stroke fill;
      stroke: rgba(3, 1, 12, .98);
      stroke-width: 2.5px;
      stroke-linejoin: round;
    }

    .peak-level,
    .measurement-level {
      fill: rgba(247, 239, 255, .96);
      font-size: 14px;
      font-weight: 800;
      paint-order: stroke fill;
      stroke: rgba(3, 1, 12, .98);
      stroke-width: 2px;
      stroke-linejoin: round;
    }

    .peak-detail {
      font-size: 11px;
      font-weight: 800;
      paint-order: stroke fill;
      stroke: rgba(3, 1, 12, .98);
      stroke-width: 1.75px;
      stroke-linejoin: round;
    }

    .chart-overlay.compact .peak-frequency,
    .chart-overlay.compact .measurement-frequency { font-size: 15px; }
    .chart-overlay.compact .peak-level,
    .chart-overlay.compact .measurement-level { font-size: 12px; }
    .chart-overlay.compact .peak-detail { font-size: 10px; }

    .shared-axis-line,
    .shared-axis-tick {
      vector-effect: non-scaling-stroke;
    }

    .shared-axis-label {
      fill: rgba(214, 205, 228, .84);
      font-size: 12px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .shared-axis-label.major {
      fill: rgba(247, 242, 255, .98);
      font-weight: 900;
    }

    .shared-axis-caption,
    .shared-axis-unit {
      fill: rgba(77, 246, 255, .72);
      font-size: 9px;
      font-weight: 900;
      letter-spacing: .14em;
    }

    .shared-axis-unit {
      fill: rgba(255, 225, 111, .88);
      letter-spacing: .08em;
    }

    .shared-axis-custom {
      fill: #ffe16f;
      font-size: 12px;
      font-weight: 900;
      paint-order: stroke fill;
      stroke: rgba(3, 1, 12, .98);
      stroke-width: 1.5px;
    }

    #sharedAxis.compact .shared-axis-label,
    #sharedAxis.compact .shared-axis-custom { font-size: 11px; }

    [hidden] { display: none !important; }

    .panel-head-tools {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
    }

    .marker-reset {
      min-height: 30px;
      padding: 0 10px;
      border-color: rgba(255, 208, 110, .5);
      color: #ffe29a;
      background: rgba(255, 182, 77, .1);
      box-shadow: 0 0 16px rgba(255, 182, 77, .12);
      font-size: 10px;
    }

    .clear-chart {
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      width: 34px;
      height: 34px;
      min-height: 34px;
      padding: 0;
      border-color: rgba(255, 60, 172, .35);
      color: #ff9bd4;
      background: rgba(255, 60, 172, .08);
    }

    .clear-chart:hover:not(:disabled) { box-shadow: 0 0 14px rgba(255, 60, 172, .3); }

    .marker-editor {
      position: absolute;
      z-index: 5;
      top: 9px;
      right: 9px;
      display: flex;
      align-items: center;
      gap: 7px;
      min-height: 44px;
      padding: 7px 8px 7px 10px;
      border: 1px solid rgba(255, 208, 110, .58);
      border-radius: 10px;
      color: #ffe29a;
      background: rgba(8, 3, 25, .96);
      box-shadow: 0 8px 28px rgba(0, 0, 0, .42), 0 0 22px rgba(255, 182, 77, .12);
      font: 700 11px/1 Consolas, monospace;
    }

    .marker-editor input {
      width: 92px;
      min-height: 30px;
      padding: 0 7px;
      border: 1px solid rgba(255, 208, 110, .42);
      border-radius: 6px;
      outline: 0;
      color: #fff9e8;
      background: rgba(255, 255, 255, .07);
      font: 700 14px/1 Consolas, monospace;
    }

    .marker-editor input:focus {
      border-color: #ffd06e;
      box-shadow: 0 0 0 2px rgba(255, 208, 110, .15);
    }

    .marker-editor button {
      min-height: 30px;
      padding: 0 10px;
      color: #170b05;
      background: linear-gradient(100deg, #ffd06e, #ff8f70);
    }

    .status {
      position: absolute;
      z-index: 3;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      display: grid;
      place-items: center;
      gap: 2px;
      width: max-content;
      max-width: calc(100% - 24px);
      padding: 7px 12px;
      color: #b6aac8;
      border: 1px solid rgba(94, 222, 255, .22);
      border-radius: 8px;
      background: rgba(16, 6, 43, .9);
      text-align: center;
      pointer-events: none;
    }

    .status small { font-size: 11px; }

    .footer-note {
      margin: 14px 3px 0;
      color: #746b82;
      font-size: 12px;
    }

    .footer-note a {
      position: absolute;
      right: 0;
      bottom: 18px;
      background: linear-gradient(90deg, #ffffff 0%, var(--cyan) 35%, #bd77ff 68%, var(--pink) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-decoration: none;
    }
    .footer-note a:hover { filter: brightness(1.2); }

    @media (min-width: 761px) and (max-width: 900px) {
      .control-deck {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        align-items: stretch;
        gap: 10px;
      }

      .controls {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 10px;
        width: 100%;
      }

      .controls > button {
        grid-column: span 3;
        width: 100%;
        min-width: 0;
        padding-inline: 9px;
      }

      .analysis-mode-control {
        grid-column: span 3;
        width: 100%;
        min-width: 0;
      }

      .analysis-mode-control select {
        flex: 1;
        min-width: 0;
        max-width: none;
      }

      .gain-control {
        grid-column: span 3;
        grid-template-columns: auto minmax(80px, 1fr) 50px;
        width: 100%;
        min-width: 0;
      }

    }

    @media (max-width: 760px) {
      .shell { width: min(100% - 14px, 1220px); padding: 15px 0 42px; }
      header { align-items: start; flex-direction: column; gap: 11px; margin-bottom: 16px; }
      .control-deck {
        align-items: stretch;
        flex-direction: column;
        padding: 0;
        border: 0;
        border-radius: 0;
        background: none;
        box-shadow: none;
        backdrop-filter: none;
      }
      .controls { display: grid; grid-template-columns: 1fr 1fr; width: 100%; }
      .controls button { width: 100%; min-height: 48px; padding: 0 10px; }
      .analysis-mode-control { grid-column: 1 / -1; width: 100%; min-height: 48px; }
      .analysis-mode-control select { flex: 1; min-width: 0; max-width: none; }
      .gain-control { grid-column: 1 / -1; width: 100%; min-height: 50px; }
      .status-row {
        display: block;
        width: 100%;
        max-width: none;
      }
      .status-row .live-pill {
        position: fixed;
        z-index: 50;
        top: 10px;
        right: 10px;
        justify-content: center;
        width: 40px;
        height: 40px;
        min-height: 40px;
        padding: 0;
      }
      .status-row .live-dot { width: 10px; height: 10px; }
      .status-row #liveText {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      .resolution { min-width: 0; justify-content: flex-start; gap: 2px 6px; font-size: 10px; line-height: 1.3; text-align: left; }
      .metrics { grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
      .metric { min-height: 92px; padding: 13px 14px; }
      .metric-label-en { font-size: clamp(8px, 2.8vw, 10px); }
      .metric-value { font-size: clamp(23px, 7vw, 32px); }
      .panel { margin-top: 10px; }
      .panel-head { min-height: 48px; padding: 10px 12px; }
      .panel-head-tools { gap: 6px; }
      .marker-reset { min-height: 34px; padding: 0 9px; }
      .marker-editor {
        left: 8px;
        right: 8px;
        justify-content: center;
        min-height: 50px;
      }
      .marker-editor input { width: min(32vw, 120px); min-height: 36px; }
      .marker-editor button { min-height: 36px; }
      #spectrum { height: 310px; }
      #waterfall { height: 364px; }
      #sharedAxis { height: 58px; }
      .status { padding: 6px 10px; font-size: 13px; }
      .footer-note { line-height: 1.5; }
      .footer-note a { bottom: 10px; }
    }

    @media (max-width: 470px) {
      .gain-control { grid-template-columns: auto minmax(90px, 1fr) 50px; width: 100%; }
      h1 { font-size: clamp(34px, 15vw, 48px); }
      .subtitle { font-size: 13px; }
      .panel-title { font-size: 10px; letter-spacing: .1em; }
      .panel-note { display: none; }
    }

    @media (max-width: 340px) {
      .eyebrow { font-size: 9px; letter-spacing: .12em; }
      h1 { font-size: 28px; }
    }

    @media (pointer: coarse) {
      button { min-height: 48px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div>
        <div class="eyebrow">Realtime acoustic terminal</div>
        <h1>NEON//NOISE</h1>
        <p class="subtitle">实时噪音频谱、峰值保持与历史频谱瀑布图</p>
      </div>
      <div class="status-row">
        <button class="live-pill" id="livePill" type="button" aria-live="polite"><span class="live-dot" aria-hidden="true"></span><span id="liveText">STANDBY</span></button>
        <div class="resolution" id="resolution"><span>FFT 32768</span><span>等待音频输入</span></div>
      </div>
    </header>

    <section class="control-deck">
      <div class="controls">
        <button class="primary" id="start">启动麦克风</button>
        <button class="analysis-button" id="analyze" type="button" disabled>分析历史频谱</button>
        <label class="analysis-mode-control">
          <span>分析方式</span>
          <select id="analysisMode" aria-label="历史频谱分析方式">
            <option value="mean">平均功率频谱（总体能量）</option>
            <option value="median">中位数频谱（稳定底噪）</option>
            <option value="maximum">最大响声频谱（短促异响）</option>
            <option value="noise">噪声频谱（噪声突出度＋出现率）</option>
          </select>
        </label>
        <label class="gain-control">
          <span>INPUT GAIN</span>
          <input id="gain" type="range" min="-36" max="36" value="0" step="1">
          <output id="gainValue" for="gain">+0 dB</output>
        </label>
      </div>
    </section>

    <section class="metrics">
      <article class="metric">
        <div class="metric-label"><span class="metric-label-en">DOMINANT FREQUENCY</span><span class="metric-label-zh">最强频率</span></div>
        <div class="metric-value" id="frequency"><span id="frequencyNumber">—</span><span class="metric-unit">Hz</span></div>
      </article>
      <article class="metric">
        <div class="metric-label"><span class="metric-label-en">RELATIVE LEVEL</span><span class="metric-label-zh">相对电平</span></div>
        <div class="metric-value" id="level"><span id="levelNumber">—</span><span class="metric-unit">dBFS</span></div>
      </article>
    </section>

    <section class="panel spectrum-stack">
      <div class="panel-head">
        <div class="panel-title" id="spectrumTitle">CURRENT SPECTRUM / 当前频谱</div>
        <div class="panel-head-tools">
          <div class="panel-note" id="spectrumNote">青色：实时 · 粉色：峰值保持</div>
          <button class="marker-reset" id="resetMarker" type="button" hidden>重置测量点</button>
          <button class="clear-chart" id="clearChart" type="button" aria-label="清空图表" title="清空图表">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6" />
            </svg>
          </button>
        </div>
      </div>
      <div class="chart-wrap">
        <canvas id="spectrum"></canvas>
        <svg id="spectrumOverlay" class="chart-overlay" preserveAspectRatio="none" aria-hidden="true"></svg>
        <form class="marker-editor" id="markerEditor" hidden>
          <label for="markerFrequency">输入频率</label>
          <input id="markerFrequency" type="number" min="1" step="0.1" inputmode="decimal">
          <span>Hz</span>
          <button type="submit">定位</button>
        </form>
        <div class="status" id="status"><span>启动麦克风后开始采集</span><small>实时采集请使用 Chrome / Edge 等外部浏览器</small></div>
      </div>
      <div class="shared-axis-wrap">
        <svg id="sharedAxis" preserveAspectRatio="none" role="img" aria-label="两张频谱图共用的频率横坐标"></svg>
      </div>
      <div class="panel-head subhead">
        <div class="panel-title">SPECTRAL HISTORY / 历史频谱</div>
        <div class="panel-note" id="historyWindow">TIME ↓ · 20 秒窗口</div>
      </div>
      <div class="chart-wrap">
        <canvas id="waterfall"></canvas>
        <svg id="waterfallOverlay" class="chart-overlay" preserveAspectRatio="none" aria-hidden="true"></svg>
      </div>
    </section>

    <footer class="footer-note">
      <span>dBFS 是数字相对电平，未经校准不等于声压级 dB SPL。</span>
      <a href="https://github.com/Arrow36/neon-noise" target="_blank" rel="noopener noreferrer">@Arrow36</a>
    </footer>
  </div>

  <script type="module">
    import {
      FFT_SIZE,
      MIN_HZ,
      HISTORY_WINDOW_MS,
      HISTORY_INTERVAL_MS,
      clampGainDb,
      gainDbToLinear,
      createFrequencyConfig,
      frequencyToRatio,
      ratioToFrequency,
      buildPixelBinMap,
      aggregateColumnsMax,
      frameBand,
      recentFrames,
      nextLifecycleState,
      isGainLocked,
      invalidateGeneration
    } from "./spectrum-core.js";

    const MIN_DB = -115;
    const MAX_DB = -20;
    const GAIN_SETTLE_MS = 90;
    const LOW_POWER_DEVICE = (window.matchMedia?.("(pointer: coarse)").matches ?? false) ||
      (navigator.hardwareConcurrency > 0 && navigator.hardwareConcurrency <= 4);
    const SPECTRUM_FRAME_INTERVAL_MS = LOW_POWER_DEVICE ? 66 : 50;
    const PEAK_ANALYSIS_INTERVAL_MS = LOW_POWER_DEVICE ? 150 : 100;
    const MAX_CANVAS_DPR = LOW_POWER_DEVICE ? 1.5 : 2;
    const UI_INTERVAL_MS = 150;
    const PEAK_HOLD_DECAY_DB_PER_SECOND = 4.5;
    const PEAK_LABEL_UPDATE_MS = 300;
    const PEAK_LABEL_HOLD_MS = 1200;
    const SPECTRUM_LABEL_SPACE = 84;
    const CUSTOM_GUIDE_COLOR = "rgba(255, 225, 111, .72)";
    const CUSTOM_GUIDE_WIDTH = 1.25;
    const CUSTOM_GUIDE_DASH = [6, 5];

    const startButton = document.querySelector("#start");
    const analyzeButton = document.querySelector("#analyze");
    const analysisModeSelect = document.querySelector("#analysisMode");
    const gainSlider = document.querySelector("#gain");
    const gainValue = document.querySelector("#gainValue");
    const frequencyValue = document.querySelector("#frequencyNumber");
    const levelValue = document.querySelector("#levelNumber");
    const resolutionLabel = document.querySelector("#resolution");
    const statusLabel = document.querySelector("#status");
    const livePill = document.querySelector("#livePill");
    const liveText = document.querySelector("#liveText");
    const historyWindowLabel = document.querySelector("#historyWindow");
    const spectrumTitle = document.querySelector("#spectrumTitle");
    const spectrumNote = document.querySelector("#spectrumNote");
    const resetMarkerButton = document.querySelector("#resetMarker");
    const clearChartButton = document.querySelector("#clearChart");
    const markerEditor = document.querySelector("#markerEditor");
    const markerFrequencyInput = document.querySelector("#markerFrequency");

    const spectrumCanvas = document.querySelector("#spectrum");
    const spectrumCtx = spectrumCanvas.getContext("2d");
    const spectrumOverlay = document.querySelector("#spectrumOverlay");
    const waterfallCanvas = document.querySelector("#waterfall");
    const waterfallCtx = waterfallCanvas.getContext("2d");
    const waterfallOverlay = document.querySelector("#waterfallOverlay");
    const sharedAxisSvg = document.querySelector("#sharedAxis");
    const SVG_NS = "http://www.w3.org/2000/svg";

    let audioContext;
    let analyser;
    let microphoneStream;
    let microphoneSource;
    let gainNode;
    let spectrum;
    let peakHold;
    let analysisSpectrum;
    let analysisPeaks = [];
    let currentAnalysisMode = "mean";
    let analysisTransitionToken = 0;
    let analysisComputeToken = 0;
    let historyFrames = [];
    let showAnalysis = false;
    let stablePeakMarkers = [];
    let lastPeakLabelUpdateAt = 0;
    let customFrequency = null;
    let customMarkerHitArea = null;
    let customPointerState = null;
    let waterfallPointerState = null;
    let lifecycleState = "idle";
    let lifecycleToken = 0;
    let resumeHistoryOnStart = false;
    let releasingAudio = false;
    let running = false;
    let historyAnchorTimestamp = 0;
    let historyGeneration = 0;
    let historyBlockUntil = 0;
    let statusClearAt = 0;
    let pendingFreshWindow = false;
    let animationFrameId = 0;
    let analysisWorker = null;
    let analysisReject = null;
    let audioConfig = createFrequencyConfig(48000, FFT_SIZE, FFT_SIZE / 2);
    let hasAudioConfiguration = false;
    let lastHistoryAt = 0;
    let lastUiAt = 0;
    let lastSpectrumFrameAt = 0;
    let lastPeakAnalysisAt = 0;
    let liveDisplayPeaks = [];
    let traceBucketCache = null;
    let waterfallBinMapCache = null;
    let waterfallColumnLevels = null;
    let spectrumBackgroundCache = null;
    let waterfallBackgroundCache = null;
    let spectrumPaintCache = null;
    let waterfallPixelsCanvas = document.createElement("canvas");
    let waterfallPixelsCtx = waterfallPixelsCanvas.getContext("2d");
    let waterfallPixelsImage = null;
    let spectrumSize = { width: 1, height: 1, dpr: 1 };
    let waterfallSize = { width: 1, height: 1, dpr: 1 };
    let sharedAxisSize = { width: 1, height: 1 };

    function fitCanvas(canvas, context) {
      const dpr = Math.min(window.devicePixelRatio || 1, MAX_CANVAS_DPR);
      const rect = canvas.getBoundingClientRect();
      const width = Math.max(1, Math.round(rect.width));
      const height = Math.max(1, Math.round(rect.height));
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      context.setTransform(dpr, 0, 0, dpr, 0, 0);
      return { width, height, dpr };
    }

    function fitSvg(svg, fallbackSize = null) {
      const rect = svg.getBoundingClientRect();
      const width = fallbackSize?.width ?? Math.max(1, Math.round(rect.width));
      const height = fallbackSize?.height ?? Math.max(1, Math.round(rect.height));
      svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
      return { width, height };
    }

    function resizeCanvases() {
      spectrumSize = fitCanvas(spectrumCanvas, spectrumCtx);
      waterfallSize = fitCanvas(waterfallCanvas, waterfallCtx);
      fitSvg(spectrumOverlay, spectrumSize);
      fitSvg(waterfallOverlay, waterfallSize);
      sharedAxisSize = fitSvg(sharedAxisSvg);
      traceBucketCache = null;
      waterfallBinMapCache = null;
      waterfallColumnLevels = new Float32Array(waterfallSize.width);
      spectrumBackgroundCache = null;
      waterfallBackgroundCache = null;
      spectrumPaintCache = null;
      waterfallPixelsCanvas.width = waterfallSize.width;
      waterfallPixelsCanvas.height = waterfallSize.height;
      waterfallPixelsImage = waterfallPixelsCtx.createImageData(waterfallSize.width, waterfallSize.height);

      const displayData = showAnalysis && analysisSpectrum ? analysisSpectrum : spectrum;
      const rawPeaks = displayData ? findPeaks(displayData) : [];
      const displayPeaks = running && !showAnalysis
        ? stabilizePeakMarkers(rawPeaks, performance.now())
        : (showAnalysis && currentAnalysisMode === "noise" ? analysisPeaks : rawPeaks);
      drawSpectrum(displayData, displayPeaks);
      drawWaterfall();
      drawSharedAxis();
    }

    function getSampleRate() {
      return audioConfig.sampleRate;
    }

    function getMaxFrequency() {
      return audioConfig.maxHz;
    }

    function getActiveBinRange(dataLength = spectrum?.length || analyser?.frequencyBinCount || 0) {
      if (dataLength < 2) return { minBin: 1, maxBin: 0, binWidth: audioConfig.binWidth };
      return {
        minBin: 1,
        maxBin: Math.max(1, Math.min(dataLength - 1, audioConfig.maxBin)),
        binWidth: audioConfig.binWidth
      };
    }

    function frequencyToX(frequency, width) {
      return frequencyToRatio(frequency, audioConfig) * width;
    }

    function xToFrequency(x, width) {
      return ratioToFrequency(x / width, audioConfig);
    }

    function dbToY(db, height) {
      const normalized = (db - MIN_DB) / (MAX_DB - MIN_DB);
      const plotHeight = Math.max(1, height - SPECTRUM_LABEL_SPACE);
      return SPECTRUM_LABEL_SPACE +
        (1 - Math.max(0, Math.min(1, normalized))) * plotHeight;
    }

    function formatFrequencyNumber(frequency) {
      const digits = frequency < 1000 ? 1 : 0;
      return frequency.toFixed(digits);
    }

    function formatFrequency(frequency) {
      return `${formatFrequencyNumber(frequency)} Hz`;
    }

    function formatPeakFrequency(frequency) {
      return running && !showAnalysis
        ? `${Math.round(frequency)} Hz`
        : formatFrequency(frequency);
    }

    function clampFrequency(frequency) {
      return Math.max(MIN_HZ, Math.min(getMaxFrequency(), frequency));
    }

    function getDisplayedSpectrum() {
      return showAnalysis && analysisSpectrum ? analysisSpectrum : spectrum;
    }

    function getLevelAtFrequency(data, frequency) {
      if (!data) return null;
      const binPosition = Math.max(1, clampFrequency(frequency) / audioConfig.binWidth);
      const leftIndex = Math.max(1, Math.min(data.length - 1, Math.floor(binPosition)));
      const rightIndex = Math.min(data.length - 1, leftIndex + 1);
      const mix = binPosition - leftIndex;
      const left = Number.isFinite(data[leftIndex]) ? data[leftIndex] : MIN_DB;
      const right = Number.isFinite(data[rightIndex]) ? data[rightIndex] : left;
      return left + (right - left) * mix;
    }

    function getPeaksForCurrentView(data, now = performance.now()) {
      if (!data) return [];
      const rawPeaks = findPeaks(data);
      if (running && !showAnalysis) return stabilizePeakMarkers(rawPeaks, now);
      if (showAnalysis && currentAnalysisMode === "noise") return analysisPeaks;
      if (!showAnalysis && stablePeakMarkers.length) return stablePeakMarkers;
      return rawPeaks;
    }

    function redrawCurrentSpectrum(now = performance.now()) {
      const data = getDisplayedSpectrum();
      drawSpectrum(data, getPeaksForCurrentView(data, now));
      drawSharedAxis();
    }

    function svgNode(tagName, attributes = {}, text = null) {
      const node = document.createElementNS(SVG_NS, tagName);
      for (const [name, value] of Object.entries(attributes)) {
        if (value !== null && value !== undefined) node.setAttribute(name, value);
      }
      if (text !== null) node.textContent = text;
      return node;
    }

    function svgText(text, x, y, className, anchor = "start") {
      return svgNode("text", {
        x,
        y,
        class: className,
        "text-anchor": anchor,
        "dominant-baseline": "hanging"
      }, text);
    }

    function syncSvgChildren(parent, desiredNodes) {
      while (parent.childNodes.length > desiredNodes.length) parent.lastChild.remove();
      desiredNodes.forEach((desired, index) => {
        const current = parent.childNodes[index];
        if (!current || current.nodeName !== desired.nodeName) {
          if (current) current.replaceWith(desired);
          else parent.append(desired);
          return;
        }
        for (const attribute of [...current.attributes]) {
          if (!desired.hasAttribute(attribute.name)) current.removeAttribute(attribute.name);
        }
        for (const attribute of desired.attributes) {
          if (current.getAttribute(attribute.name) !== attribute.value) {
            current.setAttribute(attribute.name, attribute.value);
          }
        }
        if (desired.children.length) {
          syncSvgChildren(current, [...desired.children]);
        } else if (current.textContent !== desired.textContent) {
          current.textContent = desired.textContent;
        }
      });
    }

    function getFrequencyMarks() {
      if (!hasAudioConfiguration) return [];
      const base = [1, 20, 50, 100, 200, 500, 1000, 2000, 5000, 10000, 20000];
      const max = getMaxFrequency();
      const marks = base.filter(frequency => frequency < max * .985);
      marks.push(max);
      return [...new Set(marks)];
    }

    function drawFrequencyGrid(context, width, height, withDbLabels) {
      const frequencyMarks = getFrequencyMarks();
      context.save();
      context.lineWidth = 1;

      for (const frequency of frequencyMarks) {
        if (frequency > getMaxFrequency()) continue;
        const x = frequencyToX(frequency, width);
        context.strokeStyle = frequency === 10 || frequency === 20 || frequency === 50 || frequency === 100
          ? "rgba(255, 60, 172, .24)"
          : "rgba(77, 246, 255, .12)";
        context.beginPath();
        context.moveTo(x, 0);
        context.lineTo(x, height);
        context.stroke();
      }

      if (withDbLabels) {
        for (const db of [-100, -80, -60, -40, -20]) {
          const y = dbToY(db, height);
          context.strokeStyle = "rgba(157, 84, 255, .13)";
          context.beginPath();
          context.moveTo(0, y);
          context.lineTo(width, y);
          context.stroke();
        }
      }
      context.restore();
    }

    function buildStaticBackground(width, height, withDbLabels) {
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const context = canvas.getContext("2d");
      const background = context.createLinearGradient(0, 0, 0, height);
      background.addColorStop(0, withDbLabels ? "#0b0320" : "#03010d");
      background.addColorStop(1, "#02010a");
      context.fillStyle = background;
      context.fillRect(0, 0, width, height);
      drawFrequencyGrid(context, width, height, withDbLabels);
      if (!withDbLabels) {
        for (let seconds = 0; seconds <= 20; seconds += 5) {
          const y = seconds / 20 * height;
          context.strokeStyle = "rgba(255, 255, 255, .1)";
          context.beginPath();
          context.moveTo(0, y);
          context.lineTo(width, y);
          context.stroke();
        }
      }
      return canvas;
    }

    function getTraceBucketInfo(width, dataLength) {
      const bucketCount = Math.max(2, Math.ceil(width));
      const range = getActiveBinRange(dataLength);
      const cacheKey = `${bucketCount}:${dataLength}:${audioConfig.sampleRate}:${audioConfig.fftSize}`;
      if (traceBucketCache?.key === cacheKey) return traceBucketCache;
      const mapConfig = { ...audioConfig, dataLength, maxBin: Math.min(dataLength - 1, audioConfig.maxBin) };
      traceBucketCache = {
        key: cacheKey,
        bucketCount,
        map: buildPixelBinMap(bucketCount, mapConfig),
        levels: new Float32Array(bucketCount),
        ...range
      };
      return traceBucketCache;
    }

    function buildTracePoints(data, width, height) {
      const info = getTraceBucketInfo(width, data.length);
      if (info.maxBin < info.minBin) return [];
      const levels = aggregateColumnsMax(data, info.map, MIN_DB, info.levels);

      const points = [];
      for (let x = 0; x < levels.length; x++) {
        if (Number.isFinite(levels[x])) points.push({ x, y: dbToY(levels[x], height) });
      }
      return points;
    }

    function tracePath(context, points) {
      context.beginPath();
      context.moveTo(points[0].x, points[0].y);
      for (let i = 1; i < points.length; i++) context.lineTo(points[i].x, points[i].y);
    }

    function drawTrace(context, data, color, lineWidth, glow, fill) {
      if (!data) return;
      const { width, height } = spectrumSize;
      const points = buildTracePoints(data, width, height);
      if (!points.length) return;

      context.save();
      if (fill) {
        tracePath(context, points);
        context.lineTo(points.at(-1).x, height);
        context.lineTo(points[0].x, height);
        context.closePath();
        context.fillStyle = fill;
        context.fill();
      }

      tracePath(context, points);
      context.strokeStyle = color;
      context.lineWidth = lineWidth;
      context.shadowColor = glow;
      context.shadowBlur = LOW_POWER_DEVICE ? 6 : 8;
      context.stroke();
      context.restore();
    }

    function renderSpectrumOverlay(displayData, peaks, width, height) {
      const compact = width < 520;
      spectrumOverlay.classList.toggle("compact", compact);
      const nodes = [];

      for (const db of [-100, -80, -60, -40, -20]) {
        const y = dbToY(db, height);
        nodes.push(svgText(`${db} dB`, 8, Math.max(5, y - 16), "overlay-axis-label"));
      }

      customMarkerHitArea = null;
      if (!displayData) {
        syncSvgChildren(spectrumOverlay, nodes);
        return;
      }

      const separatedColors = ["#ffd06e", "#ff75ca", "#73f8ff"];
      const unifiedLiveColor = "#73f8ff";
      const useUnifiedColor = running && !showAnalysis;
      const frequencyFont = `900 ${compact ? 15 : 19}px Consolas, monospace`;
      const levelFont = `800 ${compact ? 12 : 14}px Consolas, monospace`;
      const detailFont = `800 ${compact ? 10 : 11}px Consolas, monospace`;
      const placedLabels = [];

      spectrumCtx.save();
      peaks.slice(0, 3).forEach((peak, index) => {
        const x = frequencyToX(peak.frequency, width);
        const y = dbToY(peak.db, height);
        const markerColor = useUnifiedColor ? unifiedLiveColor : separatedColors[index];
        const frequencyText = formatPeakFrequency(peak.frequency);
        const levelText = `${peak.db.toFixed(1)} dB`;
        const detailText = Number.isFinite(peak.prominence) && Number.isFinite(peak.occurrence)
          ? `${compact ? "↑" : "突出 +"}${peak.prominence.toFixed(1)} dB · ${Math.round(peak.occurrence * 100)}%`
          : "";

        spectrumCtx.font = frequencyFont;
        const frequencyWidth = spectrumCtx.measureText(frequencyText).width;
        spectrumCtx.font = levelFont;
        const levelWidth = spectrumCtx.measureText(levelText).width;
        spectrumCtx.font = detailFont;
        const detailWidth = detailText ? spectrumCtx.measureText(detailText).width : 0;
        const labelWidth = Math.max(frequencyWidth, levelWidth, detailWidth) + 10;
        const labelHeight = detailText ? (compact ? 56 : 62) : (compact ? 38 : 44);
        let labelX = Math.max(labelWidth / 2 + 5, Math.min(width - labelWidth / 2 - 5, x));
        let labelY = Math.max(5, y - labelHeight - 15);

        for (const placed of placedLabels) {
          const labelLeft = labelX - labelWidth / 2;
          const overlaps = labelLeft < placed.x + placed.width + 7 &&
            labelLeft + labelWidth + 7 > placed.x &&
            labelY < placed.y + placed.height + 6 &&
            labelY + labelHeight + 6 > placed.y;
          if (overlaps) labelY = Math.max(5, placed.y - labelHeight - 8);
        }
        labelY = Math.min(labelY, y - labelHeight - 8);
        placedLabels.push({ x: labelX - labelWidth / 2, y: labelY, width: labelWidth, height: labelHeight });

        const anchorY = labelY + labelHeight;
        const markerGroup = svgNode("g", { class: "peak-marker" });
        markerGroup.append(
          svgNode("line", {
            class: "overlay-line",
            x1: x,
            y1: y,
            x2: labelX,
            y2: anchorY,
            stroke: markerColor,
            "stroke-width": 1.2,
            opacity: .64
          }),
          svgNode("circle", {
            cx: x,
            cy: y,
            r: compact ? 5 : 6,
            fill: "#050112",
            stroke: markerColor,
            "stroke-width": 2,
            "vector-effect": "non-scaling-stroke"
          })
        );

        const frequencyLabel = svgText(frequencyText, labelX, labelY, "peak-frequency", "middle");
        frequencyLabel.setAttribute("fill", markerColor);
        markerGroup.append(frequencyLabel);

        const levelY = labelY + (compact ? 21 : 25);
        markerGroup.append(svgText(levelText, labelX, levelY, "peak-level", "middle"));
        if (detailText) {
          const detailY = levelY + (compact ? 17 : 19);
          const detailLabel = svgText(detailText, labelX, detailY, "peak-detail", "middle");
          detailLabel.setAttribute("fill", markerColor);
          markerGroup.append(detailLabel);
        }
        nodes.push(markerGroup);
      });

      if (customFrequency !== null) {
        const frequency = clampFrequency(customFrequency);
        const db = getLevelAtFrequency(displayData, frequency);
        if (Number.isFinite(db)) {
          const x = frequencyToX(frequency, width);
          const y = dbToY(db, height);
          const color = "#ffe16f";
          const frequencyText = formatFrequency(frequency);
          const levelText = `${db.toFixed(1)} dBFS`;
          const customFrequencyFont = `900 ${compact ? 15 : 19}px Consolas, monospace`;

          spectrumCtx.font = customFrequencyFont;
          const frequencyWidth = spectrumCtx.measureText(frequencyText).width;
          spectrumCtx.font = levelFont;
          const levelWidth = spectrumCtx.measureText(levelText).width;
          const labelWidth = Math.max(frequencyWidth, levelWidth) + 16;
          const labelHeight = compact ? 39 : 45;
          const labelX = Math.max(labelWidth / 2 + 5, Math.min(width - labelWidth / 2 - 5, x));
          const labelY = Math.max(5, y - labelHeight - 15);
          const anchorY = labelY + labelHeight;
          const measurementGroup = svgNode("g", { class: "measurement-marker" });

          measurementGroup.append(
            svgNode("line", {
              class: "overlay-line",
              x1: x,
              y1: 0,
              x2: x,
              y2: height,
              stroke: CUSTOM_GUIDE_COLOR,
              "stroke-width": CUSTOM_GUIDE_WIDTH,
              "stroke-dasharray": CUSTOM_GUIDE_DASH.join(" ")
            }),
            svgNode("line", {
              class: "overlay-line",
              x1: x,
              y1: y,
              x2: labelX,
              y2: anchorY,
              stroke: color,
              "stroke-width": 1.5,
              opacity: .86
            }),
            svgNode("circle", {
              cx: x,
              cy: y,
              r: compact ? 7 : 8,
              fill: "#050112",
              stroke: color,
              "stroke-width": 2.5,
              "vector-effect": "non-scaling-stroke"
            }),
            svgNode("line", {
              class: "overlay-line",
              x1: x - 12,
              y1: y,
              x2: x + 12,
              y2: y,
              stroke: color,
              "stroke-width": 2.5
            }),
            svgNode("line", {
              class: "overlay-line",
              x1: x,
              y1: y - 12,
              x2: x,
              y2: y + 12,
              stroke: color,
              "stroke-width": 2.5
            })
          );

          const frequencyLabel = svgText(frequencyText, labelX, labelY, "measurement-frequency", "middle");
          frequencyLabel.setAttribute("fill", color);
          measurementGroup.append(
            frequencyLabel,
            svgText(levelText, labelX, labelY + (compact ? 22 : 26), "measurement-level", "middle")
          );
          nodes.push(measurementGroup);

          customMarkerHitArea = {
            pointX: x,
            pointY: y,
            labelLeft: labelX - labelWidth / 2,
            labelTop: labelY,
            labelWidth,
            labelHeight
          };
        }
      }
      spectrumCtx.restore();
      syncSvgChildren(spectrumOverlay, nodes);
    }

    function drawSpectrum(displayData = spectrum, peaks = []) {
      const { width, height } = spectrumSize;
      spectrumCtx.clearRect(0, 0, width, height);
      if (!spectrumBackgroundCache) spectrumBackgroundCache = buildStaticBackground(width, height, true);
      spectrumCtx.drawImage(spectrumBackgroundCache, 0, 0);

      if (!displayData) {
        renderSpectrumOverlay(null, [], width, height);
        return;
      }
      if (!showAnalysis) {
        drawTrace(spectrumCtx, peakHold, "rgba(255, 60, 172, .78)", 1.1, "#ff3cac", null);
      }
      const paintKey = `${width}:${height}:${showAnalysis}`;
      if (spectrumPaintCache?.key !== paintKey) {
        const fill = spectrumCtx.createLinearGradient(0, 0, 0, height);
        fill.addColorStop(0, showAnalysis ? "rgba(255, 208, 110, .24)" : "rgba(77, 246, 255, .22)");
        fill.addColorStop(.58, "rgba(116, 65, 205, .1)");
        fill.addColorStop(1, "rgba(8, 2, 24, 0)");
        const traceGradient = spectrumCtx.createLinearGradient(0, 0, width, 0);
        traceGradient.addColorStop(0, showAnalysis ? "#ffd06e" : "#4df6ff");
        traceGradient.addColorStop(.54, showAnalysis ? "#ff77c7" : "#b875ff");
        traceGradient.addColorStop(1, showAnalysis ? "#4df6ff" : "#ffcf62");
        spectrumPaintCache = { key: paintKey, fill, traceGradient };
      }
      drawTrace(spectrumCtx, displayData, spectrumPaintCache.traceGradient, showAnalysis ? 2.2 : 1.65, showAnalysis ? "#ffb64d" : "#4df6ff", spectrumPaintCache.fill);

      renderSpectrumOverlay(displayData, peaks, width, height);
    }

    function formatAxisFrequency(frequency) {
      if (frequency >= 1000) {
        const khz = frequency / 1000;
        return `${Number.isInteger(khz) ? khz : khz.toFixed(khz < 10 ? 2 : 1)}k`;
      }
      return Number.isInteger(frequency) ? String(frequency) : frequency.toFixed(1);
    }

    function getAxisLabelLayout(frequency, index, marks, width, fontSize) {
      const text = formatAxisFrequency(frequency);
      const estimatedWidth = Math.max(fontSize, text.length * fontSize * .62);
      const isFirst = index === 0;
      const isLast = index === marks.length - 1;
      const rawX = frequencyToX(frequency, width);
      const x = rawX;
      const anchor = isFirst ? "start" : isLast ? "end" : "middle";
      const left = anchor === "start" ? x : anchor === "end" ? x - estimatedWidth : x - estimatedWidth / 2;
      const right = anchor === "start" ? x + estimatedWidth : anchor === "end" ? x : x + estimatedWidth / 2;
      return { text, x, anchor, left, right, rawX };
    }

    function drawSharedAxis() {
      const { width } = sharedAxisSize;
      const compact = width < 520;
      const axisY = 15;
      const fontSize = compact ? 11 : 12;
      const labelGap = compact ? 0 : 9;
      const majorFrequencies = new Set([1, 20, 100, 1000, 10000, 20000]);
      const frequencyMarks = getFrequencyMarks();
      sharedAxisSvg.classList.toggle("compact", compact);

      const nodes = [
        svgText("FREQUENCY / Hz", 0, 1, "shared-axis-caption"),
        svgNode("line", {
          class: "shared-axis-line",
          x1: 0,
          y1: axisY,
          x2: width,
          y2: axisY,
          stroke: "rgba(77, 246, 255, .42)",
          "stroke-width": 1
        })
      ];

      const labelLayouts = frequencyMarks.map((frequency, index) =>
        getAxisLabelLayout(frequency, index, frequencyMarks, width, fontSize)
      );
      const mainEndLayout = labelLayouts[frequencyMarks.indexOf(20000)];
      let previousLabelRight = -Infinity;

      frequencyMarks.forEach((frequency, index) => {
        const isMajor = majorFrequencies.has(frequency);
        const showCompactLabel = width >= 320 || isMajor;
        const isFocusFrequency = frequency === 20 || frequency === 50 || frequency === 100;
        const layout = labelLayouts[index];
        const tickColor = isFocusFrequency
          ? "rgba(255, 60, 172, .8)"
          : isMajor
            ? "rgba(77, 246, 255, .72)"
            : "rgba(77, 246, 255, .38)";
        const tickHalfHeight = isMajor ? 8 : 5;
        nodes.push(svgNode("line", {
          class: `shared-axis-tick${isMajor ? " major" : ""}`,
          x1: layout.rawX,
          y1: axisY - tickHalfHeight,
          x2: layout.rawX,
          y2: axisY + tickHalfHeight,
          stroke: tickColor,
          "stroke-width": isMajor ? 1.4 : 1
        }));

        const overlapsPrevious = layout.left < previousLabelRight + labelGap;
        const overlapsMainEnd = mainEndLayout && frequency !== 20000 && frequency < 20000 &&
          layout.right + labelGap > mainEndLayout.left &&
          layout.left < mainEndLayout.right + labelGap;
        if (frequency !== 1 && showCompactLabel && index < labelLayouts.length - 1 && !overlapsPrevious && !overlapsMainEnd) {
          nodes.push(svgText(
            layout.text,
            layout.x,
            axisY + 10,
            `shared-axis-label${isMajor ? " major" : ""}`,
            layout.anchor
          ));
          previousLabelRight = layout.right;
        }
      });

      if (customFrequency !== null) {
        const frequency = clampFrequency(customFrequency);
        const rawX = frequencyToX(frequency, width);
        const labelX = Math.max(38, Math.min(width - 38, rawX));
        nodes.push(
          svgNode("line", {
            class: "shared-axis-tick",
            x1: rawX,
            y1: axisY - 10,
            x2: rawX,
            y2: axisY + 10,
            stroke: "#ffe16f",
            "stroke-width": 2
          }),
          svgText(formatFrequency(frequency), labelX, axisY + 29, "shared-axis-custom", "middle")
        );
      }
      syncSvgChildren(sharedAxisSvg, nodes);
    }

    function colorForLevel(db) {
      let t = Math.max(0, Math.min(1, (db - MIN_DB) / (MAX_DB - MIN_DB)));
      t = Math.pow(t, 1.18);
      const stops = [
        [0.00, [2, 1, 12]],
        [0.16, [10, 13, 48]],
        [0.34, [31, 43, 100]],
        [0.52, [100, 48, 170]],
        [0.70, [239, 48, 168]],
        [0.86, [255, 136, 80]],
        [1.00, [255, 238, 178]]
      ];
      for (let i = 1; i < stops.length; i++) {
        if (t <= stops[i][0]) {
          const [p0, c0] = stops[i - 1];
          const [p1, c1] = stops[i];
          const k = (t - p0) / (p1 - p0);
          return c0.map((value, channel) => Math.round(value + (c1[channel] - value) * k));
        }
      }
      return stops.at(-1)[1];
    }

    const COLOR_LUT_SIZE = 1024;
    const COLOR_LUT = (() => {
      const table = new Uint8ClampedArray(COLOR_LUT_SIZE * 3);
      for (let index = 0; index < COLOR_LUT_SIZE; index++) {
        const db = MIN_DB + index / (COLOR_LUT_SIZE - 1) * (MAX_DB - MIN_DB);
        const color = colorForLevel(db);
        table[index * 3] = color[0];
        table[index * 3 + 1] = color[1];
        table[index * 3 + 2] = color[2];
      }
      return table;
    })();

    function getWaterfallBinMap(dataLength) {
      const width = waterfallSize.width;
      const key = `${width}:${dataLength}:${audioConfig.sampleRate}:${audioConfig.fftSize}`;
      if (waterfallBinMapCache?.key === key) return waterfallBinMapCache.map;
      const config = { ...audioConfig, dataLength, maxBin: Math.min(dataLength - 1, audioConfig.maxBin) };
      waterfallBinMapCache = { key, map: buildPixelBinMap(width, config) };
      return waterfallBinMapCache.map;
    }

    function ensureWaterfallRow(frame) {
      const width = waterfallSize.width;
      if (frame.rowPixels?.length === width * 4) return frame.rowPixels;
      const levels = aggregateColumnsMax(frame.data, getWaterfallBinMap(frame.data.length), MIN_DB, waterfallColumnLevels);
      const pixels = new Uint8ClampedArray(width * 4);
      for (let x = 0; x < width; x++) {
        const normalized = Math.max(0, Math.min(1, (levels[x] - MIN_DB) / (MAX_DB - MIN_DB)));
        const colorIndex = Math.round(normalized * (COLOR_LUT_SIZE - 1)) * 3;
        const pixelIndex = x * 4;
        pixels[pixelIndex] = COLOR_LUT[colorIndex];
        pixels[pixelIndex + 1] = COLOR_LUT[colorIndex + 1];
        pixels[pixelIndex + 2] = COLOR_LUT[colorIndex + 2];
        pixels[pixelIndex + 3] = 255;
      }
      frame.rowPixels = pixels;
      return pixels;
    }

    function pushWaterfallRow(timestamp = performance.now()) {
      if (!spectrum || timestamp < historyBlockUntil || lastSpectrumFrameAt < historyBlockUntil) return;
      const storedBinCount = Math.min(spectrum.length, getAnalysisBinLimit() + 1);
      historyFrames.push({ timestamp, data: spectrum.slice(0, storedBinCount), generation: historyGeneration });
      historyAnchorTimestamp = timestamp;
      const cutoff = timestamp - HISTORY_WINDOW_MS;
      while (historyFrames.length && historyFrames[0].timestamp < cutoff) {
        historyFrames.shift();
      }
      updateAnalyzeAvailability();
    }

    function renderWaterfallOverlay(width, height) {
      const nodes = [];
      const secondsVisible = 20;
      for (let seconds = 0; seconds <= secondsVisible; seconds += 5) {
        const y = seconds / secondsVisible * height;
        nodes.push(svgText(
          seconds === 0 ? "NOW" : `-${seconds}s`,
          8,
          Math.min(height - 35, y + 5),
          "overlay-time-label"
        ));
      }

      if (customFrequency !== null) {
        const x = frequencyToX(clampFrequency(customFrequency), width);
        nodes.push(svgNode("line", {
          class: "overlay-line",
          x1: x,
          y1: 0,
          x2: x,
          y2: height,
          stroke: CUSTOM_GUIDE_COLOR,
          "stroke-width": CUSTOM_GUIDE_WIDTH,
          "stroke-dasharray": CUSTOM_GUIDE_DASH.join(" ")
        }));
      }
      syncSvgChildren(waterfallOverlay, nodes);
    }

    function drawWaterfall(anchorTimestamp = historyAnchorTimestamp || historyFrames.at(-1)?.timestamp || performance.now()) {
      const { width, height } = waterfallSize;
      waterfallCtx.clearRect(0, 0, width, height);
      if (!waterfallBackgroundCache) waterfallBackgroundCache = buildStaticBackground(width, height, false);
      waterfallCtx.drawImage(waterfallBackgroundCache, 0, 0);
      waterfallCtx.imageSmoothingEnabled = false;
      waterfallPixelsImage.data.fill(0);
      for (const frame of historyFrames) {
        const band = frameBand(frame.timestamp, anchorTimestamp, height);
        if (!band || band.bottom <= band.top) continue;
        const row = ensureWaterfallRow(frame);
        const firstRow = Math.max(0, Math.floor(band.top));
        const lastRow = Math.min(height - 1, Math.max(firstRow, Math.ceil(band.bottom) - 1));
        for (let y = firstRow; y <= lastRow; y++) {
          waterfallPixelsImage.data.set(row, y * width * 4);
        }
      }
      waterfallPixelsCtx.putImageData(waterfallPixelsImage, 0, 0);
      waterfallCtx.drawImage(waterfallPixelsCanvas, 0, 0);
      renderWaterfallOverlay(width, height);
      historyWindowLabel.textContent = "TIME ↓ · 真实 20 秒窗口 · 缺口留空";
    }

    function findPeaks(data) {
      if (!data) return [];
      const { minBin, maxBin, binWidth } = getActiveBinRange(data.length);
      const candidates = [];
      for (let i = minBin; i <= Math.min(data.length - 1, maxBin); i++) {
        const frequency = i * binWidth;
        if (data[i] < -98) continue;
        const left = i > minBin ? data[i - 1] : MIN_DB;
        const right = i < maxBin ? data[i + 1] : MIN_DB;
        const farLeft = i > minBin + 1 ? data[i - 2] : MIN_DB;
        const farRight = i < maxBin - 1 ? data[i + 2] : MIN_DB;
        if (data[i] > left && data[i] >= right && data[i] > farLeft && data[i] >= farRight) {
          const denominator = left - 2 * data[i] + right;
          const offset = i === minBin || i === maxBin || denominator === 0 ? 0 :
            Math.max(-1, Math.min(1, 0.5 * (left - right) / denominator));
          candidates.push({ frequency: (i + offset) * binWidth, db: data[i] });
        }
      }
      candidates.sort((a, b) => b.db - a.db);
      const selected = [];
      for (const candidate of candidates) {
        if (selected.every(peak => Math.abs(peak.frequency - candidate.frequency) >= 15)) {
          selected.push(candidate);
        }
        if (selected.length === 5) break;
      }
      return selected;
    }

    function stabilizePeakMarkers(rawPeaks, now = performance.now(), force = false) {
      if (force) {
        stablePeakMarkers = rawPeaks.slice(0, 3).map(peak => ({ ...peak, lastSeen: now, stale: false }));
        lastPeakLabelUpdateAt = now;
        return stablePeakMarkers;
      }

      const matchRangeFor = frequency => Math.max(12, Math.min(80, frequency * 0.02));
      const strongestRaw = rawPeaks[0];
      const currentLeader = stablePeakMarkers.reduce(
        (strongest, marker) => !strongest || marker.db > strongest.db ? marker : strongest,
        null
      );
      const strongestIsNew = strongestRaw && stablePeakMarkers.every(marker =>
        Math.abs(marker.frequency - strongestRaw.frequency) > matchRangeFor(marker.frequency)
      );
      const urgentNewPeak = strongestIsNew && (!currentLeader || strongestRaw.db >= currentLeader.db - 3);
      const urgentLevelRise = strongestRaw && currentLeader && strongestRaw.db >= currentLeader.db + 4;

      if (stablePeakMarkers.length &&
          now - lastPeakLabelUpdateAt < PEAK_LABEL_UPDATE_MS &&
          !urgentNewPeak && !urgentLevelRise) {
        return stablePeakMarkers;
      }

      const candidates = rawPeaks.slice(0, 8);
      const used = new Set();
      const nextMarkers = [];

      for (const previous of stablePeakMarkers) {
        let nearestIndex = -1;
        let nearestDistance = Infinity;
        candidates.forEach((candidate, index) => {
          if (used.has(index)) return;
          const distance = Math.abs(candidate.frequency - previous.frequency);
          if (distance < nearestDistance) {
            nearestDistance = distance;
            nearestIndex = index;
          }
        });

        const matchRange = matchRangeFor(previous.frequency);
        if (nearestIndex >= 0 && nearestDistance <= matchRange) {
          const candidate = candidates[nearestIndex];
          used.add(nearestIndex);
          const suddenRise = candidate.db - previous.db >= 4;
          const frequencyBlend = suddenRise ? 0.72 : 0.42;
          const levelBlend = suddenRise ? 0.86 : 0.58;
          nextMarkers.push({
            frequency: previous.frequency * (1 - frequencyBlend) + candidate.frequency * frequencyBlend,
            db: previous.db * (1 - levelBlend) + candidate.db * levelBlend,
            lastSeen: now,
            stale: false
          });
        } else if (now - (previous.lastSeen || 0) <= PEAK_LABEL_HOLD_MS) {
          nextMarkers.push({ ...previous, stale: true });
        }
      }

      candidates.forEach((candidate, index) => {
        if (nextMarkers.length >= 3 || used.has(index)) return;
        const duplicate = nextMarkers.some(marker => {
          const range = matchRangeFor(marker.frequency);
          return Math.abs(marker.frequency - candidate.frequency) <= range;
        });
        if (!duplicate) nextMarkers.push({ ...candidate, lastSeen: now, stale: false });
      });

      candidates.forEach((candidate, index) => {
        if (used.has(index)) return;
        const duplicate = nextMarkers.some(marker =>
          Math.abs(marker.frequency - candidate.frequency) <= matchRangeFor(marker.frequency)
        );
        if (!duplicate) nextMarkers.push({ ...candidate, lastSeen: now, stale: false });
      });

      stablePeakMarkers = nextMarkers
        .sort((a, b) => (b.db - (b.stale ? 8 : 0)) - (a.db - (a.stale ? 8 : 0)))
        .slice(0, 3);
      lastPeakLabelUpdateAt = now;
      return stablePeakMarkers;
    }

    function updatePeakHold(elapsedMs = SPECTRUM_FRAME_INTERVAL_MS) {
      const { minBin, maxBin } = getActiveBinRange(spectrum.length);
      const decay = PEAK_HOLD_DECAY_DB_PER_SECOND * Math.max(0, elapsedMs) / 1000;
      for (let i = minBin; i <= maxBin; i++) {
        peakHold[i] = Math.max(spectrum[i], peakHold[i] - decay);
      }
    }

    function getAnalysisBinLimit() {
      if (!spectrum) return 0;
      return getActiveBinRange(spectrum.length).maxBin;
    }

    const ANALYSIS_MODES = {
      mean: {
        title: "MEAN POWER SPECTRUM / 平均功率频谱（总体能量）",
        note: "线性能量平均"
      },
      median: {
        title: "MEDIAN SPECTRUM / 中位数频谱（稳定底噪）",
        note: "各频率取中位数"
      },
      maximum: {
        title: "MAXIMUM SPECTRUM / 最大响声频谱（短促异响）",
        note: "各频率在历史窗口内出现过的最大值"
      },
      noise: {
        title: "NOISE SPECTRUM / 噪声频谱（噪声突出度＋出现率）",
        note: "按相对周围频段的突出度与出现率综合排序"
      }
    };

    function cancelAnalysis(reason = "分析已取消") {
      analysisComputeToken = invalidateGeneration(analysisComputeToken);
      if (analysisWorker) {
        analysisWorker.terminate();
        analysisWorker = null;
      }
      if (analysisReject) {
        analysisReject(new DOMException(reason, "AbortError"));
        analysisReject = null;
      }
    }

    function computeHistoryAnalysis(frames, mode, token) {
      cancelAnalysis("已有分析被新任务替代");
      analysisComputeToken = token;
      const binCount = Math.min(...frames.map(frame => frame.data.length));
      const packed = new Float32Array(frames.length * binCount);
      frames.forEach((frame, index) => packed.set(frame.data.subarray(0, binCount), index * binCount));
      analysisWorker = new Worker("./analysis-worker.js", { type: "module" });
      return new Promise((resolve, reject) => {
        analysisReject = reject;
        analysisWorker.onmessage = event => {
          if (event.data.id !== token) return;
          analysisReject = null;
          analysisWorker?.terminate();
          analysisWorker = null;
          if (event.data.error) {
            reject(new Error(event.data.error));
            return;
          }
          resolve({ spectrum: new Float32Array(event.data.spectrumBuffer), peaks: event.data.peaks });
        };
        analysisWorker.onerror = event => {
          analysisReject = null;
          analysisWorker?.terminate();
          analysisWorker = null;
          reject(new Error(event.message || "历史分析 Worker 运行失败"));
        };
        analysisWorker.postMessage({
          id: token,
          mode,
          framesBuffer: packed.buffer,
          frameCount: frames.length,
          binCount,
          outputLength: spectrum.length,
          binLimit: Math.min(getAnalysisBinLimit(), binCount - 1),
          binWidth: audioConfig.binWidth
        }, [packed.buffer]);
      });
    }

    function getRecentHistoryFrames() {
      return recentFrames(historyFrames, historyAnchorTimestamp || historyFrames.at(-1)?.timestamp || performance.now());
    }

    function updateAnalyzeAvailability() {
      gainSlider.disabled = isGainLocked(lifecycleState, showAnalysis);
      gainSlider.title = gainSlider.disabled ? "历史分析期间增益已锁定，返回实时频谱后可调整" : "";
      if (showAnalysis) {
        analyzeButton.disabled = false;
        analyzeButton.textContent = "返回实时频谱";
        return;
      }
      analyzeButton.disabled = historyFrames.length < 1;
      analyzeButton.textContent = "分析历史频谱";
    }

    function transitionAnalysisSpectrum(fromSpectrum, toSpectrum, targetPeaks) {
      const token = ++analysisTransitionToken;
      const reduceMotion = window.matchMedia?.("(prefers-reduced-motion: reduce)").matches;
      if (!fromSpectrum || fromSpectrum.length !== toSpectrum.length || reduceMotion) {
        drawSpectrum(toSpectrum, targetPeaks);
        drawSharedAxis();
        return Promise.resolve();
      }

      const blended = new Float32Array(toSpectrum.length);
      blended.fill(MIN_DB);
      const binLimit = getAnalysisBinLimit();
      const duration = 260;

      return new Promise(resolve => {
        const startedAt = performance.now();
        let lastTransitionDrawAt = 0;
        function drawTransitionFrame(now) {
          if (token !== analysisTransitionToken) {
            resolve();
            return;
          }
          const progress = Math.max(0, Math.min(1, (now - startedAt) / duration));
          if (progress < 1 && lastTransitionDrawAt && now - lastTransitionDrawAt < 33) {
            requestAnimationFrame(drawTransitionFrame);
            return;
          }
          lastTransitionDrawAt = now;
          const eased = progress * progress * (3 - 2 * progress);
          for (let i = 0; i <= binLimit; i++) {
            const from = Number.isFinite(fromSpectrum[i]) ? fromSpectrum[i] : MIN_DB;
            const to = Number.isFinite(toSpectrum[i]) ? toSpectrum[i] : MIN_DB;
            blended[i] = from + (to - from) * eased;
          }
          const transitionPeaks = targetPeaks.map(peak => ({
            ...peak,
            db: getLevelAtFrequency(blended, peak.frequency) ?? peak.db
          }));
          drawSpectrum(blended, transitionPeaks);
          drawSharedAxis();
          if (progress < 1) {
            requestAnimationFrame(drawTransitionFrame);
          } else {
            drawSpectrum(toSpectrum, targetPeaks);
            resolve();
          }
        }
        requestAnimationFrame(drawTransitionFrame);
      });
    }

    async function calculateSelectedAnalysis() {
      const frames = getRecentHistoryFrames();
      if (!frames.length) {
        if (lifecycleState === "analyzing") {
          lifecycleState = "paused";
          renderLifecycle();
        }
        updateAnalyzeAvailability();
        return;
      }

      const computeToken = invalidateGeneration(analysisComputeToken);
      const sourceGeneration = historyGeneration;
      lifecycleState = lifecycleState === "running"
        ? nextLifecycleState(lifecycleState, "ANALYZE")
        : "analyzing";
      renderLifecycle();
      updateAnalyzeAvailability();
      const previousSpectrum = getDisplayedSpectrum()
        ? new Float32Array(getDisplayedSpectrum())
        : null;
      currentAnalysisMode = analysisModeSelect.value;
      analyzeButton.disabled = true;
      analysisModeSelect.disabled = true;
      analyzeButton.textContent = "正在计算…";
      try {
        const result = await computeHistoryAnalysis(frames, currentAnalysisMode, computeToken);
        if (computeToken !== analysisComputeToken || sourceGeneration !== historyGeneration) return;
        analysisSpectrum = result.spectrum;
        analysisPeaks = result.peaks || findPeaks(analysisSpectrum);
        showAnalysis = true;
        lifecycleState = nextLifecycleState(lifecycleState, "DONE");
        renderLifecycle();
        const coverageMs = frames.length > 1 ? frames.at(-1).timestamp - frames[0].timestamp : 0;
        const coveredSeconds = Math.min(20, Math.max(HISTORY_INTERVAL_MS / 1000, coverageMs / 1000));
        const mode = ANALYSIS_MODES[currentAnalysisMode];
        spectrumTitle.textContent = mode.title;
        spectrumNote.textContent = `${mode.note} · 有效采样跨度 ${coveredSeconds.toFixed(1)} 秒`;
        analyzeButton.textContent = "返回实时频谱";
        await transitionAnalysisSpectrum(previousSpectrum, analysisSpectrum, analysisPeaks);
      } catch (error) {
        if (error?.name !== "AbortError") {
          setStatus("历史分析失败", error?.message || String(error));
          lifecycleState = audioContext ? "paused" : "stopped";
          renderLifecycle();
        }
      } finally {
        if (computeToken === analysisComputeToken) {
          analyzeButton.disabled = false;
          analysisModeSelect.disabled = false;
          updateAnalyzeAvailability();
        }
      }
    }

    async function toggleHistoryAnalysis() {
      if (showAnalysis) {
        analysisTransitionToken++;
        showAnalysis = false;
        analyzeButton.textContent = "分析历史频谱";
        spectrumTitle.textContent = "CURRENT SPECTRUM / 当前频谱";
        spectrumNote.textContent = "青色：实时 · 粉色：峰值保持";
        updateAnalyzeAvailability();
        redrawCurrentSpectrum();
      } else {
        if (running && analyser) {
          const stoppedAt = performance.now();
          analyser.getFloatFrequencyData(spectrum);
          if (stoppedAt >= historyBlockUntil) {
            updatePeakHold(lastSpectrumFrameAt ? stoppedAt - lastSpectrumFrameAt : SPECTRUM_FRAME_INTERVAL_MS);
          }
          pushWaterfallRow(stoppedAt);
          historyAnchorTimestamp = historyFrames.at(-1)?.timestamp || stoppedAt;
          drawWaterfall();
          await releaseAudioResources({ nextState: "analyzing" });
        }
        await calculateSelectedAnalysis();
      }
    }

    function animate(now) {
      if (!running || !analyser) return;
      animationFrameId = requestAnimationFrame(animate);
      if (statusClearAt && now >= statusClearAt) {
        statusClearAt = 0;
        statusLabel.style.display = "none";
      }
      const spectrumFrameDue = !lastSpectrumFrameAt ||
        now - lastSpectrumFrameAt >= SPECTRUM_FRAME_INTERVAL_MS;

      if (spectrumFrameDue) {
        const elapsedMs = lastSpectrumFrameAt
          ? now - lastSpectrumFrameAt
          : SPECTRUM_FRAME_INTERVAL_MS;
        lastSpectrumFrameAt = now;
        analyser.getFloatFrequencyData(spectrum);
        if (now >= historyBlockUntil) {
          if (pendingFreshWindow) {
            peakHold.fill(MIN_DB);
            stablePeakMarkers = [];
            liveDisplayPeaks = [];
            pendingFreshWindow = false;
          }
          updatePeakHold(elapsedMs);
          if (!liveDisplayPeaks.length || now - lastPeakAnalysisAt >= PEAK_ANALYSIS_INTERVAL_MS) {
            liveDisplayPeaks = stabilizePeakMarkers(findPeaks(spectrum), now);
            lastPeakAnalysisAt = now;
          }
        } else {
          peakHold.fill(MIN_DB);
          liveDisplayPeaks = [];
        }
        drawSpectrum(spectrum, liveDisplayPeaks);
      }

      if (now - lastHistoryAt >= HISTORY_INTERVAL_MS) {
        pushWaterfallRow(now);
        drawWaterfall();
        lastHistoryAt = now;
      }

      if (spectrumFrameDue && now - lastUiAt >= UI_INTERVAL_MS) {
        if (liveDisplayPeaks.length) {
          frequencyValue.textContent = formatFrequencyNumber(liveDisplayPeaks[0].frequency);
          levelValue.textContent = liveDisplayPeaks[0].db.toFixed(1);
        }
        lastUiAt = now;
      }
    }

    function startAnimationLoop() {
      stopAnimationLoop();
      animationFrameId = requestAnimationFrame(animate);
    }

    function stopAnimationLoop() {
      if (animationFrameId) cancelAnimationFrame(animationFrameId);
      animationFrameId = 0;
    }

    function renderLifecycle() {
      running = lifecycleState === "running";
      const live = running;
      livePill.classList.toggle("is-live", live);
      const labels = {
        idle: ["STANDBY", "启动麦克风"],
        starting: ["CONNECTING", "正在启动…"],
        running: ["RECORDING", "暂停采集"],
        paused: ["PAUSED", "继续采集"],
        analyzing: ["ANALYZING", "继续采集"],
        stopped: ["STOPPED", "启动麦克风"],
        error: ["NO INPUT", "重试麦克风"]
      };
      const [pillText, buttonText] = labels[lifecycleState] || labels.idle;
      liveText.textContent = pillText;
      livePill.setAttribute("aria-label", `${pillText}，${buttonText}`);
      livePill.title = `${pillText} · ${buttonText}`;
      startButton.textContent = buttonText;
      startButton.disabled = lifecycleState === "starting";
      livePill.disabled = lifecycleState === "starting" || releasingAudio;
    }

    function setStatus(message, detail = "") {
      statusLabel.replaceChildren();
      const summary = document.createElement("span");
      summary.textContent = message;
      statusLabel.append(summary);
      if (detail) {
        const small = document.createElement("small");
        small.textContent = detail;
        statusLabel.append(small);
      }
      statusLabel.style.display = "grid";
    }

    function getMicrophoneConstraints() {
      return {
        audio: {
          echoCancellation: false,
          noiseSuppression: false,
          autoGainControl: false
        }
      };
    }

    async function reconnectMicrophoneIfNeeded(token) {
      const audioTracks = microphoneStream?.getAudioTracks() || [];
      const hasUsableTrack = audioTracks.some(track => track.readyState === "live" && !track.muted);
      if (hasUsableTrack) return;

      const replacementStream = await navigator.mediaDevices.getUserMedia(getMicrophoneConstraints());
      if (token !== lifecycleToken || !audioContext) {
        replacementStream.getTracks().forEach(track => track.stop());
        throw new DOMException("连接已取消", "AbortError");
      }
      let replacementSource;
      try {
        replacementSource = audioContext.createMediaStreamSource(replacementStream);
        replacementSource.connect(gainNode);
      } catch (error) {
        replacementStream.getTracks().forEach(track => track.stop());
        throw error;
      }
      microphoneSource?.disconnect();
      microphoneStream?.getTracks().forEach(track => track.stop());
      microphoneStream = replacementStream;
      microphoneSource = replacementSource;
      attachTrackLifecycle(replacementStream);
    }

    function applyInputGain({ reset = true } = {}) {
      const db = clampGainDb(gainSlider.value);
      gainSlider.value = String(db);
      const linearGain = gainDbToLinear(db);
      gainValue.textContent = `${db >= 0 ? "+" : ""}${db} dB`;
      if (gainNode && audioContext) {
        gainNode.gain.setTargetAtTime(linearGain, audioContext.currentTime, 0.015);
      }
      if (reset && spectrum) {
        const fftWindowMs = (analyser?.fftSize || FFT_SIZE) / getSampleRate() * 1000;
        historyBlockUntil = performance.now() + GAIN_SETTLE_MS + fftWindowMs;
        pendingFreshWindow = true;
        spectrum.fill(MIN_DB);
        clearHistory(`输入增益已改为 ${db >= 0 ? "+" : ""}${db} dB，历史与峰值已重置`);
      }
    }

    function attachTrackLifecycle(stream) {
      for (const track of stream.getAudioTracks()) {
        track.addEventListener("ended", () => {
          if (releasingAudio || stream !== microphoneStream) return;
          stopAnimationLoop();
          lifecycleState = "error";
          renderLifecycle();
          setStatus("麦克风已断开", "可以重新连接设备后点击“重试麦克风”。");
        }, { once: true });
      }
    }

    function handleAudioContextStateChange() {
      if (!audioContext || lifecycleState !== "running") return;
      if (audioContext.state === "suspended" || audioContext.state === "interrupted") {
        stopAnimationLoop();
        lifecycleState = nextLifecycleState(lifecycleState, "INTERRUPT");
        historyAnchorTimestamp = historyFrames.at(-1)?.timestamp || performance.now();
        renderLifecycle();
        setStatus("音频上下文已暂停", "返回前台后点击“继续采集”；缺失时段会在瀑布图中留空。");
      }
    }

    async function releaseAudioResources({ nextState = "paused" } = {}) {
      const token = ++lifecycleToken;
      stopAnimationLoop();
      cancelAnalysis("麦克风已停止");
      running = false;
      lifecycleState = nextState;
      if (nextState === "paused" || nextState === "analyzing") resumeHistoryOnStart = true;
      releasingAudio = true;
      startButton.disabled = true;
      livePill.disabled = true;
      try { microphoneSource?.disconnect(); } catch (_) {}
      try { gainNode?.disconnect(); } catch (_) {}
      try { analyser?.disconnect(); } catch (_) {}
      microphoneStream?.getTracks().forEach(track => track.stop());
      const context = audioContext;
      microphoneStream = undefined;
      microphoneSource = undefined;
      gainNode = undefined;
      analyser = undefined;
      audioContext = undefined;
      if (context && context.state !== "closed") {
        try { await context.close(); } catch (_) {}
      }
      releasingAudio = false;
      if (token !== lifecycleToken) return;
      analysisModeSelect.disabled = false;
      updateAnalyzeAvailability();
      renderLifecycle();
    }

    function refreshAudioConfiguration() {
      const nextConfig = createFrequencyConfig(audioContext.sampleRate, analyser.fftSize, analyser.frequencyBinCount);
      const incompatibleHistory = historyFrames.length && (
        nextConfig.sampleRate !== audioConfig.sampleRate ||
        nextConfig.fftSize !== audioConfig.fftSize ||
        nextConfig.dataLength !== audioConfig.dataLength
      );
      audioConfig = nextConfig;
      hasAudioConfiguration = true;
      markerFrequencyInput.min = String(MIN_HZ);
      markerFrequencyInput.max = String(audioConfig.maxHz);
      traceBucketCache = null;
      waterfallBinMapCache = null;
      waterfallColumnLevels = new Float32Array(waterfallSize.width);
