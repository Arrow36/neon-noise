      spectrumBackgroundCache = null;
      waterfallBackgroundCache = null;
      spectrumPaintCache = null;
      customFrequency = customFrequency === null ? null : clampFrequency(customFrequency);
      if (incompatibleHistory) clearHistory("实际采样率已改变，不兼容的历史与峰值已重置");
      const windowMs = analyser.fftSize / audioContext.sampleRate * 1000;
      resolutionLabel.replaceChildren(...[
        `采样率 ${audioContext.sampleRate} Hz`,
        `FFT ${analyser.fftSize}`,
        `频点间距 ${audioConfig.binWidth.toFixed(2)} Hz`,
        `分析窗 ${windowMs.toFixed(1)} ms`
      ].map(value => {
        const part = document.createElement("span");
        part.textContent = value;
        return part;
      }));
      drawSharedAxis();
      drawWaterfall();
    }

    async function startOrToggleCapture() {
      if (audioContext) {
        const token = ++lifecycleToken;
        try {
          if (running) {
            historyAnchorTimestamp = historyFrames.at(-1)?.timestamp || performance.now();
            const pausedPeaks = stablePeakMarkers.length
              ? stablePeakMarkers
              : (spectrum ? findPeaks(spectrum) : []);
            drawSpectrum(spectrum, pausedPeaks);
            drawWaterfall();
            await releaseAudioResources({ nextState: "paused" });
            setStatus("采集已暂停，麦克风已释放");
          } else {
            cancelAnalysis("已恢复采集");
            analysisModeSelect.disabled = false;
            updateAnalyzeAvailability();
            if (audioContext.state !== "running") await audioContext.resume();
            if (token !== lifecycleToken) return;
            await reconnectMicrophoneIfNeeded(token);
            if (token !== lifecycleToken) return;
            if (showAnalysis) {
              analysisTransitionToken++;
              showAnalysis = false;
              spectrumTitle.textContent = "CURRENT SPECTRUM / 当前频谱";
              spectrumNote.textContent = "青色：实时 · 粉色：峰值保持";
              updateAnalyzeAvailability();
            }
            lifecycleState = "running";
            lastHistoryAt = 0;
            lastSpectrumFrameAt = 0;
            lastPeakAnalysisAt = 0;
            statusLabel.style.display = "none";
            renderLifecycle();
            startAnimationLoop();
          }
        } catch (error) {
          if (error?.name === "AbortError" || token !== lifecycleToken) return;
          lifecycleState = "error";
          renderLifecycle();
          setStatus("恢复麦克风失败", `${error?.message || error}。请检查浏览器麦克风权限后重试。`);
        }
        return;
      }

      try {
        const token = ++lifecycleToken;
        const continuingHistory = resumeHistoryOnStart;
        if (continuingHistory) {
          cancelAnalysis("已恢复采集");
          analysisTransitionToken++;
          showAnalysis = false;
          analysisModeSelect.disabled = false;
          spectrumTitle.textContent = "CURRENT SPECTRUM / 当前频谱";
          spectrumNote.textContent = "青色：实时 · 粉色：峰值保持";
          updateAnalyzeAvailability();
        }
        lifecycleState = "starting";
        renderLifecycle();
        setStatus("正在请求麦克风权限…");
        if (!continuingHistory && (historyFrames.length || showAnalysis)) {
          clearHistory("开始新的麦克风会话，旧历史与峰值已重置");
        }

        if (!navigator.mediaDevices?.getUserMedia) {
          throw new Error("当前浏览器未开放麦克风接口，请使用 Chrome 或 Edge 打开此页面");
        }

        microphoneStream = await navigator.mediaDevices.getUserMedia(getMicrophoneConstraints());
        if (token !== lifecycleToken) {
          microphoneStream.getTracks().forEach(track => track.stop());
          microphoneStream = undefined;
          return;
        }
        attachTrackLifecycle(microphoneStream);

        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) throw new Error("当前浏览器不支持 Web Audio API");
        audioContext = new AudioContextClass();
        audioContext.addEventListener("statechange", handleAudioContextStateChange);
        await audioContext.resume();
        if (token !== lifecycleToken) return;
        analyser = audioContext.createAnalyser();
        analyser.fftSize = FFT_SIZE;
        analyser.minDecibels = MIN_DB;
        analyser.maxDecibels = MAX_DB;
        analyser.smoothingTimeConstant = 0.05;
        gainNode = audioContext.createGain();
        spectrum = new Float32Array(analyser.frequencyBinCount);
        peakHold = new Float32Array(analyser.frequencyBinCount);
        peakHold.fill(MIN_DB);
        microphoneSource = audioContext.createMediaStreamSource(microphoneStream);
        microphoneSource.connect(gainNode);
        gainNode.connect(analyser);
        refreshAudioConfiguration();
        applyInputGain({ reset: false });
        historyBlockUntil = Math.max(historyBlockUntil,
          performance.now() + analyser.fftSize / audioContext.sampleRate * 1000);
        pendingFreshWindow = true;
        resumeHistoryOnStart = false;

        lifecycleState = "running";
        lastHistoryAt = 0;
        lastUiAt = 0;
        lastSpectrumFrameAt = 0;
        lastPeakAnalysisAt = 0;
        liveDisplayPeaks = [];
        statusLabel.style.display = "none";
        renderLifecycle();
        startAnimationLoop();
      } catch (error) {
        const permissionHint = error.name === "NotAllowedError"
          ? "麦克风权限被拒绝。请在浏览器地址栏的网站权限中允许麦克风。"
          : error?.message || String(error);
        await releaseAudioResources({ nextState: "error" });
        setStatus(permissionHint, "已释放本次创建的资源，可直接重试。内置浏览器不支持时请改用 Chrome / Edge。");
      }
    }

    function getSpectrumPointerPosition(event) {
      const rect = spectrumCanvas.getBoundingClientRect();
      return {
        x: Math.max(0, Math.min(spectrumSize.width, (event.clientX - rect.left) / rect.width * spectrumSize.width)),
        y: Math.max(0, Math.min(spectrumSize.height, (event.clientY - rect.top) / rect.height * spectrumSize.height))
      };
    }

    function hitsCustomMarker(x, y) {
      if (!customMarkerHitArea) return false;
      const area = customMarkerHitArea;
      const pointDistance = Math.hypot(x - area.pointX, y - area.pointY);
      const hitsLabel = x >= area.labelLeft - 9 &&
        x <= area.labelLeft + area.labelWidth + 9 &&
        y >= area.labelTop - 7 &&
        y <= area.labelTop + area.labelHeight + 7;
      const hitsGuide = Math.abs(x - area.pointX) <= 11 && y >= SPECTRUM_LABEL_SPACE;
      return pointDistance <= 28 || hitsLabel || hitsGuide;
    }

    function setCustomFrequency(frequency, closeEditor = true) {
      if (!getDisplayedSpectrum()) return;
      customFrequency = clampFrequency(frequency);
      resetMarkerButton.hidden = false;
      markerFrequencyInput.value = customFrequency < 1000
        ? customFrequency.toFixed(1)
        : customFrequency.toFixed(0);
      if (closeEditor) markerEditor.hidden = true;
      redrawCurrentSpectrum();
      drawWaterfall();
    }

    function setCustomFrequencyFromX(x, closeEditor = true) {
      setCustomFrequency(xToFrequency(Math.max(0, Math.min(spectrumSize.width, x)), spectrumSize.width), closeEditor);
    }

    function openMarkerEditor() {
      if (customFrequency === null) return;
      markerFrequencyInput.max = String(getMaxFrequency());
      markerFrequencyInput.value = customFrequency < 1000
        ? customFrequency.toFixed(1)
        : customFrequency.toFixed(0);
      markerFrequencyInput.setCustomValidity("");
      markerEditor.hidden = false;
      requestAnimationFrame(() => {
        markerFrequencyInput.focus({ preventScroll: true });
        markerFrequencyInput.select();
      });
    }

    function resetCustomMarker() {
      customFrequency = null;
      customMarkerHitArea = null;
      customPointerState = null;
      waterfallPointerState = null;
      markerEditor.hidden = true;
      resetMarkerButton.hidden = true;
      redrawCurrentSpectrum();
      drawWaterfall();
    }

    function handleSpectrumPointerDown(event) {
      if (!getDisplayedSpectrum()) return;
      if (event.pointerType === "mouse" && event.button !== 0) return;
      const position = getSpectrumPointerPosition(event);
      const startedOnMarker = hitsCustomMarker(position.x, position.y);
      customPointerState = {
        id: event.pointerId,
        pointerType: event.pointerType,
        startX: position.x,
        startY: position.y,
        lastX: position.x,
        lastY: position.y,
        startedOnMarker,
        dragged: false,
        dragOffsetX: startedOnMarker && customMarkerHitArea
          ? customMarkerHitArea.pointX - position.x
          : 0
      };
      markerEditor.hidden = true;
      try { spectrumCanvas.setPointerCapture(event.pointerId); } catch (_) {}

      if (event.pointerType !== "touch" && !startedOnMarker) {
        setCustomFrequencyFromX(position.x);
      }
    }

    function handleSpectrumPointerMove(event) {
      if (!customPointerState || customPointerState.id !== event.pointerId) return;
      const position = getSpectrumPointerPosition(event);
      customPointerState.lastX = position.x;
      customPointerState.lastY = position.y;
      const dx = position.x - customPointerState.startX;
      const dy = position.y - customPointerState.startY;
      if (Math.hypot(dx, dy) < 5) return;

      if (customPointerState.pointerType === "touch" && Math.abs(dy) > Math.abs(dx) * 1.15) {
        return;
      }

      customPointerState.dragged = true;
      setCustomFrequencyFromX(position.x + customPointerState.dragOffsetX);
      event.preventDefault();
    }

    function handleSpectrumPointerUp(event) {
      if (!customPointerState || customPointerState.id !== event.pointerId) return;
      const state = customPointerState;
      const position = getSpectrumPointerPosition(event);
      customPointerState = null;
      try { spectrumCanvas.releasePointerCapture(event.pointerId); } catch (_) {}

      if (state.startedOnMarker && !state.dragged) {
        openMarkerEditor();
      } else if (state.pointerType === "touch" && !state.dragged) {
        setCustomFrequencyFromX(position.x);
      }
    }

    function handleSpectrumPointerCancel(event) {
      if (customPointerState?.id === event.pointerId) customPointerState = null;
    }

    function getWaterfallPointerPosition(event) {
      const rect = waterfallCanvas.getBoundingClientRect();
      return {
        x: Math.max(0, Math.min(waterfallSize.width, (event.clientX - rect.left) / rect.width * waterfallSize.width)),
        y: Math.max(0, Math.min(waterfallSize.height, (event.clientY - rect.top) / rect.height * waterfallSize.height))
      };
    }

    function setCustomFrequencyFromWaterfallX(x) {
      const clampedX = Math.max(0, Math.min(waterfallSize.width, x));
      setCustomFrequency(xToFrequency(clampedX, waterfallSize.width));
    }

    function handleWaterfallPointerDown(event) {
      if (!historyFrames.length) return;
      if (event.pointerType === "mouse" && event.button !== 0) return;
      const position = getWaterfallPointerPosition(event);
      waterfallPointerState = {
        id: event.pointerId,
        pointerType: event.pointerType,
        startX: position.x,
        startY: position.y,
        dragged: false
      };
      markerEditor.hidden = true;
      try { waterfallCanvas.setPointerCapture(event.pointerId); } catch (_) {}
      if (event.pointerType !== "touch") setCustomFrequencyFromWaterfallX(position.x);
    }

    function handleWaterfallPointerMove(event) {
      if (!waterfallPointerState || waterfallPointerState.id !== event.pointerId) return;
      const position = getWaterfallPointerPosition(event);
      const dx = position.x - waterfallPointerState.startX;
      const dy = position.y - waterfallPointerState.startY;
      if (Math.hypot(dx, dy) < 5) return;
      if (waterfallPointerState.pointerType === "touch" && Math.abs(dy) > Math.abs(dx) * 1.15) return;
      waterfallPointerState.dragged = true;
      setCustomFrequencyFromWaterfallX(position.x);
      event.preventDefault();
    }

    function handleWaterfallPointerUp(event) {
      if (!waterfallPointerState || waterfallPointerState.id !== event.pointerId) return;
      const state = waterfallPointerState;
      const position = getWaterfallPointerPosition(event);
      waterfallPointerState = null;
      try { waterfallCanvas.releasePointerCapture(event.pointerId); } catch (_) {}
      if (state.pointerType === "touch" && !state.dragged) {
        setCustomFrequencyFromWaterfallX(position.x);
      }
    }

    function handleWaterfallPointerCancel(event) {
      if (waterfallPointerState?.id === event.pointerId) waterfallPointerState = null;
    }

    function clearHistory(message = "历史、分析结果和峰值保持已清空") {
      analysisTransitionToken++;
      cancelAnalysis(message);
      if (lifecycleState === "analyzing") {
        lifecycleState = audioContext ? "paused" : "stopped";
        renderLifecycle();
      }
      historyGeneration = invalidateGeneration(historyGeneration);
      historyFrames = [];
      historyAnchorTimestamp = performance.now();
      analysisSpectrum = undefined;
      analysisPeaks = [];
      showAnalysis = false;
      stablePeakMarkers = [];
      liveDisplayPeaks = [];
      lastPeakLabelUpdateAt = 0;
      lastPeakAnalysisAt = 0;
      analysisModeSelect.disabled = false;
      updateAnalyzeAvailability();
      spectrumTitle.textContent = "CURRENT SPECTRUM / 当前频谱";
      spectrumNote.textContent = "青色：实时 · 粉色：峰值保持";
      if (peakHold) peakHold.fill(MIN_DB);
      drawWaterfall();
      drawSpectrum(spectrum, spectrum ? findPeaks(spectrum) : []);
      drawSharedAxis();
      if (message) {
        setStatus(message, "新的历史只会包含当前配置稳定后的数据。");
        statusClearAt = running ? performance.now() + 1800 : 0;
      }
    }

    function clearCharts() {
      if (running && analyser && audioContext) {
        historyBlockUntil = Math.max(historyBlockUntil,
          performance.now() + analyser.fftSize / audioContext.sampleRate * 1000);
        pendingFreshWindow = true;
      }
      if (spectrum) spectrum.fill(MIN_DB);
      resetCustomMarker();
      clearHistory("");
      statusClearAt = 0;
      statusLabel.style.display = "none";
      frequencyValue.textContent = "—";
      levelValue.textContent = "—";
    }

    startButton.addEventListener("click", startOrToggleCapture);
    livePill.addEventListener("click", startOrToggleCapture);
    clearChartButton.addEventListener("click", clearCharts);
    analyzeButton.addEventListener("click", toggleHistoryAnalysis);
    analysisModeSelect.addEventListener("change", () => {
      currentAnalysisMode = analysisModeSelect.value;
      if (showAnalysis) calculateSelectedAnalysis();
    });
    resetMarkerButton.addEventListener("click", resetCustomMarker);
    markerEditor.addEventListener("submit", event => {
      event.preventDefault();
      const frequency = Number(markerFrequencyInput.value);
      if (!Number.isFinite(frequency) || frequency < MIN_HZ || frequency > getMaxFrequency()) {
        markerFrequencyInput.setCustomValidity(`请输入 ${MIN_HZ} 到 ${getMaxFrequency()} Hz 之间的频率`);
        markerFrequencyInput.reportValidity();
        return;
      }
      markerFrequencyInput.setCustomValidity("");
      setCustomFrequency(frequency);
    });
    markerFrequencyInput.addEventListener("input", () => markerFrequencyInput.setCustomValidity(""));
    markerFrequencyInput.addEventListener("keydown", event => {
      if (event.key === "Escape") {
        markerEditor.hidden = true;
        spectrumCanvas.focus({ preventScroll: true });
      }
    });
    spectrumCanvas.addEventListener("pointerdown", handleSpectrumPointerDown);
    spectrumCanvas.addEventListener("pointermove", handleSpectrumPointerMove);
    spectrumCanvas.addEventListener("pointerup", handleSpectrumPointerUp);
    spectrumCanvas.addEventListener("pointercancel", handleSpectrumPointerCancel);
    waterfallCanvas.addEventListener("pointerdown", handleWaterfallPointerDown);
    waterfallCanvas.addEventListener("pointermove", handleWaterfallPointerMove);
    waterfallCanvas.addEventListener("pointerup", handleWaterfallPointerUp);
    waterfallCanvas.addEventListener("pointercancel", handleWaterfallPointerCancel);
    gainSlider.addEventListener("input", applyInputGain);
    window.addEventListener("resize", resizeCanvases);
    applyInputGain({ reset: false });
    updateAnalyzeAvailability();
    resizeCanvases();
    renderLifecycle();
  </script>
</body>
</html>
